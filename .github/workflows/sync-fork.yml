name: Sync Fork Daily

on:
  schedule:
    # 每天 UTC 时间 2:00 运行（北京时间 10:00）
    - cron: '0 2 * * *'
  # 也可以手动触发
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add upstream remote and fetch
        run: |
          git remote add upstream https://github.com/cmliu/edgetunnel.git
          git fetch upstream

      - name: Sync all upstream branches
        run: |
          for branch in $(git branch -r | grep 'upstream/' | grep -v 'upstream/HEAD' | sed 's/upstream\///'); do
            echo "=== Syncing branch: $branch ==="
            git checkout -B "$branch" "upstream/$branch"
            git push origin "$branch"
          done

      - name: Sync all tags
        run: |
          git push --tags origin
